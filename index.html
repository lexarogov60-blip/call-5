<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CalmConnect</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: { colors: { brand: '#8B9AE0', brandSoft: '#A5B4FC' } } }
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', sans-serif; }
  html, body { height: 100%; }
  body { background: linear-gradient(135deg, #EEF2FF 0%, #F8F9FA 50%, #FCE7F3 100%); }
  .dark body { background: linear-gradient(135deg, #0B0F1E 0%, #111827 50%, #1E1B4B 100%); }
  .glass { background: rgba(255,255,255,0.72); backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%); border: 1px solid rgba(255,255,255,0.55); box-shadow: 0 4px 16px rgba(0,0,0,0.04); }
  .dark .glass { background: rgba(31,41,55,0.75); border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 4px 16px rgba(0,0,0,0.25); }
  .glass-2 { background: rgba(255,255,255,0.55); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); }
  .dark .glass-2 { background: rgba(55,65,81,0.5); border: 1px solid rgba(255,255,255,0.06); }
  .bubble-me { background: linear-gradient(135deg, #8B9AE0 0%, #6D7FD6 100%); color: #fff; border-radius: 22px 22px 6px 22px; box-shadow: 0 2px 8px rgba(109,127,214,0.2); }
  .bubble-other { background: #FFFFFF; color: #1F2937; border-radius: 22px 22px 22px 6px; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .dark .bubble-other { background: #374151; color: #F9FAFB; border: 1px solid rgba(255,255,255,0.06); }
  @keyframes messageIn { from { opacity:0; transform:translateY(8px) scale(0.97); } to { opacity:1; transform:translateY(0) scale(1); } }
  .animate-message { animation: messageIn 0.3s cubic-bezier(0.22,1,0.36,1) both; }
  @keyframes modalIn { from { opacity:0; transform:translateY(20px) scale(0.95); } to { opacity:1; transform:translateY(0) scale(1); } }
  .animate-modal { animation: modalIn 0.3s cubic-bezier(0.22,1,0.36,1) both; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  .animate-fade { animation: fadeIn 0.25s ease both; }
  @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(139,154,224,0.4); } 70% { box-shadow: 0 0 0 16px rgba(139,154,224,0); } 100% { box-shadow: 0 0 0 0 rgba(139,154,224,0); } }
  .calling-pulse { animation: pulse-ring 1.6s infinite; }
  .btn-icon { transition: all 0.25s cubic-bezier(0.22,1,0.36,1); cursor: pointer; border-radius: 14px; }
  .btn-icon:hover { background: rgba(139,154,224,0.1); }
  .dark .btn-icon:hover { background: rgba(255,255,255,0.06); }
  .btn-icon:active { transform: scale(0.93); }
  .input-field { background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); transition: all 0.25s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
  .dark .input-field { background: #374151; border: 1px solid rgba(255,255,255,0.06); }
  .input-field:focus-within { border-color: rgba(139,154,224,0.6); box-shadow: 0 0 0 3px rgba(139,154,224,0.12); }
  .modal-overlay { position: fixed; inset: 0; z-index: 9999; display: none; align-items: center; justify-content: center; background: rgba(20,20,40,0.5); backdrop-filter: blur(8px); padding: 1rem; }
  .modal-overlay.show { display: flex; animation: fadeIn 0.25s ease both; }
  .send-btn { background: linear-gradient(135deg, #8B9AE0 0%, #6D7FD6 100%); box-shadow: 0 2px 8px rgba(139,154,224,0.25); transition: all 0.25s ease; border-radius: 14px; }
  .send-btn:active { transform: scale(0.94); }
  .online-dot { box-shadow: 0 0 0 2px rgba(255,255,255,0.9); }
  .dark .online-dot { box-shadow: 0 0 0 2px #1F2937; }
  .call-ctrl { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.2); color: white; backdrop-filter: blur(10px); transition: all 0.25s cubic-bezier(0.22,1,0.36,1); cursor: pointer; border: 1px solid rgba(255,255,255,0.15); }
  .call-ctrl:hover { background: rgba(255,255,255,0.3); }
  .call-ctrl:active { transform: scale(0.93); }
  .call-ctrl.muted { background: rgba(255,255,255,0.95); color: #374151; }
  .call-ctrl.end { background: #EF4444; box-shadow: 0 4px 16px rgba(239,68,68,0.5); border-color: rgba(239,68,68,0.3); }
  .call-ctrl.end:hover { background: #DC2626; }
  .call-ctrl.accept { background: #22C55E; box-shadow: 0 4px 16px rgba(34,197,94,0.5); }
  .call-ctrl.accept:hover { background: #16A34A; }
  .scroll-smooth-custom::-webkit-scrollbar { width: 6px; }
  .scroll-smooth-custom::-webkit-scrollbar-thumb { background: rgba(139,154,224,0.3); border-radius: 3px; }
  #logPanel { position: fixed; bottom: 10px; right: 10px; z-index: 99999; width: 340px; max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.85); color: #a3e635; font-family: monospace; font-size: 11px; padding: 8px 10px; border-radius: 12px; display: none; }
  #logPanel.show { display: block; }
  #logPanel .err { color: #f87171; }
  #logPanel .info { color: #60a5fa; }
  #logPanel .ok { color: #4ade80; }
</style>
</head>
<body class="h-screen w-screen flex overflow-hidden text-gray-800 dark:text-gray-100">

<!-- ЭКРАН ВХОДА / ХОСТА -->
<div id="loginScreen" class="fixed inset-0 z-[10000] flex items-center justify-center bg-gradient-to-br from-[#EEF2FF] via-[#F8F9FA] to-[#FCE7F3] dark:from-[#0B0F1E] dark:via-[#111827] dark:to-[#1E1B4B] p-4">
  <div class="glass rounded-[28px] p-8 w-full max-w-md text-center animate-modal">
    <div class="w-16 h-16 mx-auto mb-5 rounded-[20px] bg-gradient-to-br from-brand to-[#6D7FD6] flex items-center justify-center text-white">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
    </div>

    <!-- ХОСТ -->
    <div id="hostView">
      <h1 class="text-xl font-semibold mb-1">Вы — хост</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Отправьте эту ссылку собеседнику</p>

      <div class="input-field rounded-[16px] px-4 py-3 mb-3 flex items-center gap-2">
        <input type="text" id="shareLink" readonly class="flex-1 bg-transparent border-none outline-none text-xs text-gray-600 dark:text-gray-300 truncate">
        <button onclick="copyLink()" class="btn-icon p-2 text-brand dark:text-brandSoft flex-shrink-0" title="Скопировать">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        </button>
      </div>

      <button onclick="copyLink()" class="w-full py-3 rounded-[16px] bg-gradient-to-br from-brand to-[#6D7FD6] text-white font-medium text-sm hover:opacity-90 active:scale-[0.98] transition mb-4">
        Скопировать ссылку
      </button>

      <div class="flex items-center justify-center gap-2 text-xs text-gray-500 dark:text-gray-400">
        <span class="w-2 h-2 rounded-full bg-yellow-400" id="hostStatusDot"></span>
        <span id="hostStatusText">Ожидание собеседника…</span>
      </div>
    </div>

    <!-- ГОСТЬ -->
    <div id="guestView" class="hidden">
      <h1 class="text-xl font-semibold mb-1">Подключение…</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Комната: <span id="guestRoomId" class="font-mono font-semibold"></span></p>

      <div class="flex items-center justify-center gap-2 text-xs text-gray-500 dark:text-gray-400">
        <span class="w-2 h-2 rounded-full bg-yellow-400" id="guestStatusDot"></span>
        <span id="guestStatusText">Ищем хоста…</span>
      </div>
    </div>

    <p id="loginError" class="text-xs text-red-500 mt-4 hidden"></p>
    <button onclick="toggleLogs()" class="text-[10px] text-gray-400 hover:text-brand mt-4 underline">Показать диагностику</button>
  </div>
</div>

<!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
<div id="app" class="h-screen w-screen flex overflow-hidden hidden">
  <aside class="glass w-20 lg:w-64 flex flex-col justify-between py-6 px-3 m-4 rounded-[32px]">
    <div>
      <div class="flex items-center gap-3 px-3 mb-8 text-brand dark:text-brandSoft font-semibold text-lg">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
        <span class="hidden lg:block tracking-tight">Calm</span>
      </div>
      <div class="hidden lg:flex items-center gap-2 px-3 py-3 text-xs text-gray-500 dark:text-gray-400">
        <span id="myDot" class="w-2 h-2 rounded-full bg-green-400"></span>
        <span>Вы: <span id="myNameLabel" class="font-medium">—</span></span>
      </div>
      <div class="hidden lg:flex items-center gap-2 px-3 py-2 text-xs text-gray-500 dark:text-gray-400">
        <span id="peerDot" class="w-2 h-2 rounded-full bg-gray-300"></span>
        <span>Собеседник: <span id="peerNameLabel" class="font-medium">—</span></span>
      </div>
    </div>
    <button onclick="logout()" class="hidden lg:flex items-center justify-center gap-2 py-3 rounded-[16px] glass-2 text-gray-600 dark:text-gray-300 text-sm font-medium">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
      Выйти
    </button>
  </aside>

  <main class="flex-1 flex gap-4 my-4 mr-4 overflow-hidden">
    <div class="glass flex-1 flex flex-col rounded-[32px] overflow-hidden relative">
      <header class="px-6 py-4 flex items-center justify-between border-b border-black/5 dark:border-white/5">
        <div class="flex items-center gap-3">
          <img id="headerPeerAvatar" src="https://i.pravatar.cc/150?u=peer" class="w-11 h-11 rounded-[16px] object-cover">
          <div>
            <h3 id="headerPeerName" class="font-medium text-sm">Собеседник</h3>
            <p id="headerPeerStatus" class="text-xs text-gray-500 dark:text-gray-400">Не в сети</p>
          </div>
        </div>
        <div class="flex items-center gap-1">
          <button type="button" onclick="startCall('audio')" class="btn-icon p-2.5 text-brand dark:text-brandSoft" title="Аудиозвонок">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
          </button>
          <button type="button" onclick="startCall('video')" class="btn-icon p-2.5 text-brand dark:text-brandSoft" title="Видеозвонок">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
          </button>
          <button type="button" onclick="toggleLogs()" class="btn-icon p-2.5 text-gray-400" title="Диагностика">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
          </button>
        </div>
      </header>

      <div id="messageContainer" class="flex-1 overflow-y-auto scroll-smooth-custom p-6 space-y-3 flex flex-col"></div>

      <div id="typingIndicator" class="px-6 pb-1 text-xs text-gray-400 italic hidden">печатает…</div>

      <div class="p-4">
        <div class="input-field flex items-center gap-2 rounded-[22px] px-4 py-2">
          <input type="text" id="messageInput" placeholder="Сообщение..." class="flex-1 bg-transparent border-none outline-none text-sm placeholder-gray-400 dark:placeholder-gray-500 py-1.5" onkeypress="handleKeyPress(event)" oninput="handleTyping()">
          <button type="button" onclick="sendMessage()" class="send-btn text-white p-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ВХОДЯЩИЙ ЗВОНОК -->
<div id="incomingCallModal" class="modal-overlay">
  <div class="glass rounded-[28px] p-8 w-full max-w-sm text-center animate-modal">
    <div class="calling-pulse w-28 h-28 mx-auto mb-5 rounded-full overflow-hidden border-4 border-white dark:border-white/10">
      <img id="incomingAvatar" src="https://i.pravatar.cc/150?u=peer" class="w-full h-full object-cover">
    </div>
    <h3 id="incomingName" class="text-lg font-semibold mb-1">Собеседник</h3>
    <p id="incomingType" class="text-sm text-gray-500 dark:text-gray-400 mb-7">Входящий звонок…</p>
    <div class="flex justify-center gap-6">
      <button type="button" onclick="rejectCall()" class="call-ctrl end" title="Отклонить">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.517l2.257-1.128a1 1 0 00.502-1.21L9.228 3.683A1 1 0 008.279 3H5z"></path></svg>
      </button>
      <button type="button" onclick="acceptCall()" class="call-ctrl accept" title="Принять">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
      </button>
    </div>
  </div>
</div>

<!-- ЭКРАН ЗВОНКА -->
<div id="callScreen" class="fixed inset-0 z-[9999] hidden bg-gradient-to-br from-[#1E1B4B] via-[#111827] to-[#0B0F1E] text-white">
  <div class="relative w-full h-full">
    <video id="remoteVideo" autoplay playsinline class="absolute inset-0 w-full h-full object-cover"></video>

    <div id="remotePlaceholder" class="absolute inset-0 flex items-center justify-center bg-gradient-to-br from-[#1E1B4B] via-[#111827] to-[#0B0F1E]">
      <div class="text-center">
        <div class="calling-pulse w-32 h-32 mx-auto mb-5 rounded-full overflow-hidden border-4 border-white/10">
          <img id="callPeerAvatar" src="https://i.pravatar.cc/150?u=peer" class="w-full h-full object-cover">
        </div>
        <h3 id="callPeerName" class="text-2xl font-semibold mb-2">Собеседник</h3>
        <p id="callStatusText" class="text-sm text-white/60">Соединение…</p>
      </div>
    </div>

    <div class="absolute top-6 right-6 w-48 h-36 rounded-2xl overflow-hidden border-2 border-white/20 shadow-2xl bg-black/40">
      <video id="localVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
    </div>

    <div id="callDuration" class="absolute top-6 left-6 px-4 py-2 rounded-full bg-black/30 backdrop-blur-xl border border-white/10 text-sm font-mono hidden">00:00</div>

    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-4 px-6 py-4 rounded-full bg-black/30 backdrop-blur-xl border border-white/10">
      <button id="btnMute" onclick="toggleMute()" class="call-ctrl" title="Микрофон">
        <svg id="iconMicOn" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
        <svg id="iconMicOff" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
      </button>
      <button id="btnCamera" onclick="toggleCamera()" class="call-ctrl" title="Камера">
        <svg id="iconCamOn" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        <svg id="iconCamOff" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 3l18 18"></path></svg>
      </button>
      <button onclick="endCall()" class="call-ctrl end" title="Завершить">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.517l2.257-1.128a1 1 0 00.502-1.21L9.228 3.683A1 1 0 008.279 3H5z"></path></svg>
      </button>
    </div>
  </div>
</div>

<div id="logPanel"></div>

<script>
// ============================================================
//  НАСТРОЙКИ
// ============================================================
const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
const ICE_SERVERS = [
  { urls: 'stun:stun.sipnet.ru:3478' },
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:stun.nextcloud.com:443' },
  {
    urls: 'turn:openrelay.metered.ca:443',
    username: 'openrelayproject',
    credential: 'openrelayproject'
  },
  {
    urls: 'turns:openrelay.metered.ca:443?transport=tcp',
    username: 'openrelayproject',
    credential: 'openrelayproject'
  }
];

// ============================================================
//  РОЛИ
// ============================================================
const urlParams = new URLSearchParams(location.search);
const roomFromUrl = urlParams.get('room');
const isHost = !roomFromUrl;
const roomId = isHost ? generateRoomId() : roomFromUrl;
const myRole = isHost ? 'host' : 'guest';
const peerRole = isHost ? 'guest' : 'host';
const myDisplay = isHost ? 'Вы (хост)' : 'Вы (гость)';
const peerDisplay = isHost ? 'Гость' : 'Хост';

// ============================================================
//  СОСТОЯНИЕ
// ============================================================
let mqttClient = null;
let pc = null;
let localStream = null;
let remoteStream = null;
let currentCallType = null;
let incomingOffer = null;
let callTimerInterval = null;
let callStartTime = null;
let isMuted = false;
let isCameraOff = false;
let typingTimeout = null;
let isCaller = false;
let peerOnline = false;
let peerCheckInterval = null;
let lastPeerPing = 0;

const $ = (id) => document.getElementById(id);

// ============================================================
//  УТИЛИТЫ
// ============================================================
function generateRoomId() {
  return Math.random().toString(36).slice(2, 8).toUpperCase();
}

function log(msg, type = 'info') {
  const panel = $('logPanel');
  const t = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  const line = document.createElement('div');
  line.className = type;
  line.textContent = `[${t}] ${msg}`;
  panel.appendChild(line);
  panel.scrollTop = panel.scrollHeight;
  console.log(`[${type}]`, msg);
}
function toggleLogs() { $('logPanel').classList.toggle('show'); }

// ============================================================
//  ИНИЦИАЛИЗАЦИЯ ЭКРАНА
// ============================================================
function initScreen() {
  if (isHost) {
    const link = `${location.origin}${location.pathname}?room=${roomId}`;
    $('shareLink').value = link;
    $('hostView').classList.remove('hidden');
    $('guestView').classList.add('hidden');
    log(`Комната создана: ${roomId}`, 'ok');
    log('Скопируйте ссылку и отправьте другу', 'info');
  } else {
    $('guestRoomId').innerText = roomId;
    $('hostView').classList.add('hidden');
    $('guestView').classList.remove('hidden');
    log(`Подключение к комнате: ${roomId}`, 'info');
  }
  connectMQTT();
}

function copyLink() {
  const input = $('shareLink');
  input.select();
  input.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(input.value).then(() => {
    const btn = event.target.closest('button');
    if (btn) {
      const orig = btn.innerHTML;
      btn.innerHTML = '✅ Скопировано!';
      setTimeout(() => btn.innerHTML = orig, 1500);
    }
    log('Ссылка скопирована в буфер обмена', 'ok');
  }).catch(() => {
    document.execCommand('copy');
    alert('Ссылка скопирована');
  });
}

// ============================================================
//  MQTT — сигналинг и чат
// ============================================================
function connectMQTT() {
  log('Подключение к MQTT брокеру…', 'info');

  mqttClient = mqtt.connect(MQTT_BROKER, {
    clientId: 'cc_' + Math.random().toString(16).slice(2, 10),
    clean: true,
    connectTimeout: 15000,
    reconnectPeriod: 3000,
    keepalive: 30
  });

  mqttClient.on('connect', () => {
    log('✅ MQTT подключён', 'ok');
    mqttClient.subscribe(`calm/${roomId}`, { qos: 0 });
    log(`Подписка на канал комнаты ${roomId}`, 'info');

    // Приветствуем всех
    sendMQTT({ type: 'hello', from: myRole });
    startPeerCheck();

    // Если мы хост и уже есть гость — он нам ответит
    // Если мы гость — хост получит hello и тоже ответит
  });

  mqttClient.on('message', (topic, payload) => {
    try {
      const msg = JSON.parse(payload.toString());
      if (msg.from === myRole) return;
      handleMessage(msg);
    } catch (e) {
      log('Ошибка парсинга: ' + e.message, 'err');
    }
  });

  mqttClient.on('error', (err) => {
    log('❌ MQTT ошибка: ' + err.message, 'err');
    showError('Проблема с подключением к серверу. Проверьте интернет.');
  });

  mqttClient.on('reconnect', () => log('Переподключение к MQTT…', 'info'));
  mqttClient.on('offline', () => log('⚠️ MQTT offline', 'err'));
}

function sendMQTT(msg) {
  if (!mqttClient || !mqttClient.connected) return;
  mqttClient.publish(`calm/${roomId}`, JSON.stringify({ ...msg, from: myRole }), { qos: 0 });
}

function startPeerCheck() {
  if (peerCheckInterval) clearInterval(peerCheckInterval);
  peerCheckInterval = setInterval(() => {
    sendMQTT({ type: 'ping' });

    // Если не было ping от собеседника >8 сек — offline
    if (Date.now() - lastPeerPing > 8000) {
      if (peerOnline) {
        peerOnline = false;
        updatePeerStatus(false);
        log('Собеседник отключился', 'info');
      }
    }
  }, 3000);
}

function handleMessage(msg) {
  switch (msg.type) {
    case 'hello':
      log(`📩 Собеседник подключился (${msg.from})`, 'ok');
      lastPeerPing = Date.now();
      if (!peerOnline) { peerOnline = true; updatePeerStatus(true); showApp(); }
      sendMQTT({ type: 'welcome' });
      break;

    case 'welcome':
    case 'ping':
      lastPeerPing = Date.now();
      if (!peerOnline) {
        peerOnline = true;
        updatePeerStatus(true);
        showApp();
        log('✅ Собеседник в сети', 'ok');
      }
      break;

    case 'bye':
      log('Собеседник вышел', 'info');
      peerOnline = false;
      updatePeerStatus(false);
      break;

    // ===== ЧАТ =====
    case 'chat':
      renderMessage({ text: msg.text, time: msg.time, mine: false });
      break;

    case 'typing':
      $('typingIndicator').classList.toggle('hidden', !msg.on);
      break;

    // ===== ЗВОНКИ =====
    case 'offer':
      handleOffer(msg.sdp, msg.callType);
      break;
    case 'answer':
      handleAnswer(msg.sdp);
      break;
    case 'ice':
      handleIce(msg.candidate);
      break;
    case 'call-reject':
      log('Звонок отклонён', 'info');
      endCall(true);
      break;
    case 'call-end':
      log('Собеседник завершил звонок', 'info');
      endCall(true);
      break;
  }
}

function updatePeerStatus(online) {
  $('peerDot').className = 'w-2 h-2 rounded-full ' + (online ? 'bg-green-400' : 'bg-gray-300');
  $('myDot').className = 'w-2 h-2 rounded-full bg-green-400';
  $('headerPeerStatus').innerText = online ? 'Онлайн' : 'Не в сети';
  $('headerPeerStatus').className = online ? 'text-xs text-green-500' : 'text-xs text-gray-500 dark:text-gray-400';

  // На экране входа
  if (isHost) {
    $('hostStatusDot').className = 'w-2 h-2 rounded-full ' + (online ? 'bg-green-400' : 'bg-yellow-400');
    $('hostStatusText').innerText = online ? 'Собеседник подключился' : 'Ожидание собеседника…';
  } else {
    $('guestStatusDot').className = 'w-2 h-2 rounded-full ' + (online ? 'bg-green-400' : 'bg-yellow-400');
    $('guestStatusText').innerText = online ? 'Подключено!' : 'Ищем хоста…';
  }
}

function showApp() {
  $('myNameLabel').innerText = myDisplay;
  $('peerNameLabel').innerText = peerDisplay;
  $('headerPeerName').innerText = peerDisplay;
  const url = `https://i.pravatar.cc/150?u=${peerRole}`;
  $('headerPeerAvatar').src = url;
  $('callPeerAvatar').src = url;
  $('incomingAvatar').src = url;
  $('loginScreen').classList.add('hidden');
  $('app').classList.remove('hidden');
}

function showError(text) {
  $('loginError').innerText = text;
  $('loginError').classList.remove('hidden');
}

function logout() {
  sendMQTT({ type: 'bye' });
  if (peerCheckInterval) clearInterval(peerCheckInterval);
  if (mqttClient) mqttClient.end();
  if (pc) pc.close();
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  location.reload();
}

// ============================================================
//  ЧАТ
// ============================================================
function sendMessage() {
  const inp = $('messageInput');
  const text = inp.value.trim();
  if (!text) return;

  const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  sendMQTT({ type: 'chat', text, time });
  renderMessage({ text, time, mine: true });
  inp.value = '';
}

function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

function handleTyping() {
  sendMQTT({ type: 'typing', on: true });
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => sendMQTT({ type: 'typing', on: false }), 1200);
}

function renderMessage({ text, time, mine }) {
  const c = $('messageContainer');
  const d = document.createElement('div');
  const esc = text.replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));

  if (mine) {
    d.className = 'flex flex-col items-end self-end max-w-[75%] animate-message';
    d.innerHTML = `<div class="bubble-me px-4 py-2.5 text-sm break-words">${esc}</div>
      <div class="flex items-center gap-1 mt-1 mr-2">
        <span class="text-[10px] text-gray-400">${time}</span>
        <svg class="w-3 h-3 text-brand dark:text-brandSoft" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
      </div>`;
  } else {
    d.className = 'flex flex-col items-start max-w-[75%] animate-message';
    d.innerHTML = `<div class="bubble-other px-4 py-2.5 text-sm break-words">${esc}</div>
      <span class="text-[10px] text-gray-400 mt-1 ml-2">${time}</span>`;
  }

  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}

// ============================================================
//  ЗВОНКИ (WebRTC)
// ============================================================
async function getLocalStream(video) {
  log(`Запрос доступа к ${video ? 'камере и микрофону' : 'микрофону'}…`);
  try {
    return await navigator.mediaDevices.getUserMedia({
      video: video ? { width: { ideal: 1280 }, height: { ideal: 720 } } : false,
      audio: { echoCancellation: true, noiseSuppression: true }
    });
  } catch (e) {
    log('❌ Ошибка доступа к медиа: ' + e.message, 'err');
    alert('Не удалось получить доступ: ' + e.message);
    throw e;
  }
}

function createPeerConnection() {
  const conn = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  conn.onicecandidate = (e) => {
    if (e.candidate) {
      sendMQTT({ type: 'ice', candidate: e.candidate });
    }
  };

  conn.ontrack = (e) => {
    log('🎬 Удалённый поток получен', 'ok');
    if (!remoteStream) remoteStream = new MediaStream();
    e.streams[0].getTracks().forEach(t => {
      if (!remoteStream.getTracks().find(x => x.id === t.id)) remoteStream.addTrack(t);
    });
    $('remoteVideo').srcObject = remoteStream;
    $('remotePlaceholder').classList.add('hidden');
    $('callStatusText').innerText = 'Соединение установлено';
    startCallTimer();
  };

  conn.onconnectionstatechange = () => {
    log(`Состояние: ${conn.connectionState}`, 'info');
    if (conn.connectionState === 'failed') {
      log('Соединение не удалось. Возможно, нужен TURN-сервер.', 'err');
      endCall(true);
    }
  };

  return conn;
}

async function startCall(type) {
  if (pc) return alert('Уже в звонке');
  if (!peerOnline) return alert('Собеседник не в сети');

  currentCallType = type;
  isCaller = true;
  log(`📞 Исходящий ${type}-звонок`, 'info');

  try {
    localStream = await getLocalStream(type === 'video');
    $('localVideo').srcObject = localStream;

    pc = createPeerConnection();
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    sendMQTT({ type: 'offer', sdp: offer, callType: type });

    $('callScreen').classList.remove('hidden');
    $('remotePlaceholder').classList.remove('hidden');
    $('callStatusText').innerText = 'Исходящий звонок…';
    $('callDuration').classList.add('hidden');
    $('btnCamera').style.display = type === 'video' ? 'flex' : 'none';
  } catch (e) {
    log('Ошибка звонка: ' + e.message, 'err');
    endCall(true);
  }
}

async function handleOffer(sdp, callType) {
  if (pc) {
    log('Уже в звонке, отклоняем', 'err');
    sendMQTT({ type: 'call-reject' });
    return;
  }

  currentCallType = callType;
  isCaller = false;
  incomingOffer = sdp;
  log(`📩 Входящий ${callType}-звонок`, 'ok');

  $('incomingType').innerText = callType === 'video' ? 'Входящий видеозвонок…' : 'Входящий аудиозвонок…';
  $('incomingCallModal').classList.add('show');
}

async function acceptCall() {
  $('incomingCallModal').classList.remove('show');
  if (!incomingOffer) return;

  try {
    localStream = await getLocalStream(currentCallType === 'video');
    $('localVideo').srcObject = localStream;

    pc = createPeerConnection();
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    await pc.setRemoteDescription(new RTCSessionDescription(incomingOffer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    sendMQTT({ type: 'answer', sdp: answer });

    $('callScreen').classList.remove('hidden');
    $('remotePlaceholder').classList.remove('hidden');
    $('callStatusText').innerText = 'Соединение…';
    $('btnCamera').style.display = currentCallType === 'video' ? 'flex' : 'none';

    incomingOffer = null;
  } catch (e) {
    log('Ошибка принятия: ' + e.message, 'err');
    endCall(true);
  }
}

async function handleAnswer(sdp) {
  if (!pc) return;
  try {
    await pc.setRemoteDescription(new RTCSessionDescription(sdp));
    log('✅ Answer принят', 'ok');
  } catch (e) {
    log('Ошибка answer: ' + e.message, 'err');
  }
}

async function handleIce(candidate) {
  if (!pc) return;
  try {
    await pc.addIceCandidate(new RTCIceCandidate(candidate));
  } catch (e) {
    log('ICE ошибка: ' + e.message, 'err');
  }
}

function rejectCall() {
  $('incomingCallModal').classList.remove('show');
  sendMQTT({ type: 'call-reject' });
  incomingOffer = null;
}

function endCall(silent = false) {
  if (!silent) sendMQTT({ type: 'call-end' });

  if (pc) { try { pc.close(); } catch(e){} pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  remoteStream = null;

  $('callScreen').classList.add('hidden');
  $('remoteVideo').srcObject = null;
  $('localVideo').srcObject = null;
  $('remotePlaceholder').classList.remove('hidden');
  $('incomingCallModal').classList.remove('show');
  stopCallTimer();

  isMuted = false; isCameraOff = false; isCaller = false;
  updateMuteUI(); updateCameraUI();
}

function toggleMute() {
  if (!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
  updateMuteUI();
}
function updateMuteUI() {
  $('btnMute').classList.toggle('muted', isMuted);
  $('iconMicOn').classList.toggle('hidden', isMuted);
  $('iconMicOff').classList.toggle('hidden', !isMuted);
}

function toggleCamera() {
  if (!localStream) return;
  isCameraOff = !isCameraOff;
  localStream.getVideoTracks().forEach(t => t.enabled = !isCameraOff);
  updateCameraUI();
}
function updateCameraUI() {
  $('btnCamera').classList.toggle('muted', isCameraOff);
  $('iconCamOn').classList.toggle('hidden', isCameraOff);
  $('iconCamOff').classList.toggle('hidden', !isCameraOff);
}

function startCallTimer() {
  if (callTimerInterval) return;
  callStartTime = Date.now();
  $('callDuration').classList.remove('hidden');
  callTimerInterval = setInterval(() => {
    const s = Math.floor((Date.now() - callStartTime) / 1000);
    $('callDuration').innerText = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  }, 1000);
}
function stopCallTimer() {
  clearInterval(callTimerInterval); callTimerInterval = null;
  $('callDuration').innerText = '00:00';
  $('callDuration').classList.add('hidden');
}

// ============================================================
//  СТАРТ
// ============================================================
initScreen();
window.addEventListener('beforeunload', () => {
  if (mqttClient && mqttClient.connected) sendMQTT({ type: 'bye' });
});
</script>
