<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MQTT Test</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  body { font-family: monospace; background: #0b0f1e; color: #e5e7eb; padding: 20px; }
  .test { padding: 12px; margin: 8px 0; border-radius: 8px; background: #1f2937; font-size: 13px; }
  .ok { background: #065f46; }
  .err { background: #7f1d1d; }
  .pending { background: #78350f; }
  h1 { color: #a5b4fc; }
  button { padding: 10px 20px; background: #8B9AE0; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
</style>
</head>
<body>
<h1>Тест WQTT из браузера</h1>
<p>Логин: <b>u_E08RBR</b></p>
<button onclick="runTests()">▶ Запустить</button>
<div id="results"></div>

<script>
const USER = 'u_E08RBR';
const PASS = 'kKT5IV5L';
const CONFIGS = [
  { name: 'порт 22481 /mqtt',      url: 'wss://m8.wqtt.ru:22481/mqtt' },
  { name: 'порт 22481 /',           url: 'wss://m8.wqtt.ru:22481/' },
  { name: 'порт 22481 /ws',         url: 'wss://m8.wqtt.ru:22481/ws' },
  { name: 'порт 22481 (нет пути)',  url: 'wss://m8.wqtt.ru:22481' },
  { name: 'порт 22479 /mqtt',       url: 'wss://m8.wqtt.ru:22479/mqtt' },
  { name: 'порт 443 /mqtt',         url: 'wss://m8.wqtt.ru:443/mqtt' },
  { name: 'порт 8084 /mqtt',        url: 'wss://m8.wqtt.ru:8084/mqtt' },
];

async function testOne(cfg) {
  return new Promise((resolve) => {
    const div = document.createElement('div');
    div.className = 'test pending';
    div.innerHTML = `⏳ ${cfg.name} — <small>${cfg.url}</small>`;
    document.getElementById('results').appendChild(div);

    let done = false;
    const timer = setTimeout(() => {
      if (done) return; done = true;
      div.className = 'test err';
      div.innerHTML = `❌ ${cfg.name} — <small>${cfg.url}</small><br><b>Таймаут 8 сек</b>`;
      try { c.end(true); } catch(e){}
      resolve(false);
    }, 8000);

    let c;
    try {
      c = mqtt.connect(cfg.url, {
        clientId: 'test_' + Math.random().toString(16).slice(2, 10),
        username: USER, password: PASS,
        connectTimeout: 7000, reconnectPeriod: 0,
        protocolVersion: 4, rejectUnauthorized: false
      });
    } catch (e) {
      clearTimeout(timer); done = true;
      div.className = 'test err';
      div.innerHTML = `❌ ${cfg.name}<br><b>${e.message}</b>`;
      return resolve(false);
    }

    c.on('connect', () => {
      if (done) return; done = true; clearTimeout(timer);
      div.className = 'test ok';
      div.innerHTML = `✅ ${cfg.name} — <small>${cfg.url}</small><br><b>РАБОТАЕТ!</b>`;
      c.end(true); resolve(true);
    });
    c.on('error', (err) => {
      if (done) return; done = true; clearTimeout(timer);
      div.className = 'test err';
      div.innerHTML = `❌ ${cfg.name} — <small>${cfg.url}</small><br><b>${err.message}</b>`;
      try { c.end(true); } catch(e){}
      resolve(false);
    });
  });
}

async function runTests() {
  document.getElementById('results').innerHTML = '';
  for (const cfg of CONFIGS) await testOne(cfg);
}
</script>
</body>
</html>
